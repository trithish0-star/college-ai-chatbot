services:
  - type: web
    name: college-ai-chatbot
    runtime: python
    buildCommand: pip install -r requirements.txt && python database.py
    startCommand: gunicorn app:app --workers 2 --threads 4 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: SECRET_KEY
        generateValue: true
